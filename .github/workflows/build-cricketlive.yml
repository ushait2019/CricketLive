name: Build Cricket Live APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o "CricketLive_FINAL_USHA_IT_RemoteReady_v3_Fixed.zip" -d project

      - name: Check Android project
        run: |
          echo "Project files:"
          find project -maxdepth 3 -type f | sort | head -100

          if [ ! -f "project/settings.gradle.kts" ] && [ ! -f "project/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          if [ ! -f "project/build.gradle.kts" ] && [ ! -f "project/build.gradle" ]; then
            echo "ERROR: Gradle build file not found!"
            exit 1
          fi

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricketLive-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
